[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threadaware"
version = "0.1.0"
description = "Evaluation framework for long-horizon conversational continuity and wellbeing-relevant model behavior."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
threadaware = "threadaware.api:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
